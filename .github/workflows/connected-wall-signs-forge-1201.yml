name: Connected Wall Signs Forge 1.20.1 (isolated)
on:
  workflow_dispatch:
  push:
    branches:
      - port/connected-wall-signs-forge-1.20.1
    paths:
      - 'connected-wall-signs-forge-1.20.1/**'
      - '.github/workflows/connected-wall-signs-forge-1201.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connected-wall-signs-forge-1.20.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Check source metadata
        run: bash scripts/verify-source.sh
      - name: Compile Forge mod
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon build --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ForgeGradle build failed after 3 attempts"
              exit 1
            fi
            echo "::warning::ForgeGradle dependency resolution/build failed; retrying in 20 seconds (attempt $attempt)"
            sleep 20
          done
      - name: Upload JAR only after successful build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: connected-wall-signs-forge-1.20.1
          path: connected-wall-signs-forge-1.20.1/build/libs/*.jar
          if-no-files-found: error
