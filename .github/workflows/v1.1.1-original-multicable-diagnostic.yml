                  for(int i=0;i<target.getContainerSize();i++)if(target.getItem(i).is(net.minecraft.world.item.Items.DIAMOND))b+=target.getItem(i).getCount();
                  if(b==0)throw new IllegalStateException("Standalone ITEM cable transferred no diamonds");
