            static final class StandaloneOriginalCablesTest extends GameTestInstance {
              StandaloneOriginalCablesTest(TestData<net.minecraft.core.Holder<TestEnvironmentDefinition<?>>> d){super(d);}
              @Override public com.mojang.serialization.MapCodec<? extends GameTestInstance> codec(){throw new UnsupportedOperationException("CI-only registered test");}
              @Override protected net.minecraft.network.chat.MutableComponent typeDescription(){return Component.literal("Four original standalone cable blocks");}
              @Override public void run(GameTestHelper helper){
                var world=helper.getLevel();
                var blocks=java.util.List.of(ObsidianNetwork.NETWORK_CABLE.get(),ObsidianNetwork.ITEM_CABLE.get(),ObsidianNetwork.FLUID_CABLE.get(),ObsidianNetwork.ENERGY_CABLE.get());
                var names=java.util.List.of("NETWORK","ITEM","FLUID","ENERGY");
                for(int i=0;i<blocks.size();i++){
                  var block=blocks.get(i);
                  if(block==net.minecraft.world.level.block.Blocks.AIR || block==ObsidianNetwork.MULTI_CABLE.get())
                    throw new IllegalStateException(names.get(i)+" standalone cable registry aliases AIR or MultiCable");
                  for(int j=0;j<i;j++)if(block==blocks.get(j))
                    throw new IllegalStateException(names.get(i)+" cable aliases "+names.get(j));
                  var pos=helper.absolutePos(new BlockPos(i+1,1,3));
                  world.setBlock(pos,block.defaultBlockState(),3);
                  if(!world.getBlockState(pos).is(block))
                    throw new IllegalStateException(names.get(i)+" original standalone cable cannot be placed");
                }
                helper.succeed();
              }
            }
            static final class LayerTest extends GameTestInstance {
              LayerTest(TestData<net.minecraft.core.Holder<TestEnvironmentDefinition<?>>> d){super(d);}
              @Override public com.mojang.serialization.MapCodec<? extends GameTestInstance> codec(){throw new UnsupportedOperationException("CI-only registered test");}
              @Override protected net.minecraft.network.chat.MutableComponent typeDescription(){return Component.literal("Original MultiCable four-layer runtime");}
              @Override public void run(GameTestHelper helper){
                BlockPos p=helper.absolutePos(new BlockPos(2,1,2));
                helper.getLevel().setBlock(p,ObsidianNetwork.MULTI_CABLE.get().defaultBlockState(),3);
                var be=(MultiCableBlockEntity)helper.getLevel().getBlockEntity(p);
                if(be==null)throw new IllegalStateException("Missing original MultiCable block entity");
                for(var layer:MultiCableBlockEntity.Layer.values()){
                  if(!be.has(layer)&&!be.add(layer))throw new IllegalStateException("Cannot install "+layer);
                  if(!be.has(layer))throw new IllegalStateException("Missing installed "+layer);
                }
                if(be.layerCount()!=4)throw new IllegalStateException("Incorrect layer count");
                if(be.energyHandler(Direction.NORTH)==null)throw new IllegalStateException("Missing ENERGY capability");
                be.setLogistics(MultiCableBlockEntity.Layer.ITEM,Direction.WEST,1,0,0);
                be.setLogistics(MultiCableBlockEntity.Layer.ITEM,Direction.EAST,2,0,0);
                be.setLogistics(MultiCableBlockEntity.Layer.FLUID,Direction.NORTH,1,0,0);
                be.setLogistics(MultiCableBlockEntity.Layer.FLUID,Direction.SOUTH,2,0,0);
                if(be.logisticsMode(MultiCableBlockEntity.Layer.ITEM,Direction.WEST)!=1)throw new IllegalStateException("ITEM input configuration lost");
                if(be.logisticsMode(MultiCableBlockEntity.Layer.ITEM,Direction.EAST)!=2)throw new IllegalStateException("ITEM output configuration lost");
                if(be.logisticsMode(MultiCableBlockEntity.Layer.FLUID,Direction.NORTH)!=1)throw new IllegalStateException("FLUID input configuration lost");
                if(be.logisticsMode(MultiCableBlockEntity.Layer.FLUID,Direction.SOUTH)!=2)throw new IllegalStateException("FLUID output configuration lost");
                be.setEnabled(MultiCableBlockEntity.Layer.ENERGY,Direction.NORTH,false);
                if(be.energyHandler(Direction.NORTH)!=null)throw new IllegalStateException("Disabled ENERGY face exposes capability");
                be.setEnabled(MultiCableBlockEntity.Layer.ENERGY,Direction.NORTH,true);
                if(be.energyHandler(Direction.NORTH)==null)throw new IllegalStateException("Reenabled ENERGY face missing capability");
                // Physical mixed route: chest -> MultiCable -> standalone ITEM -> MultiCable -> chest.
                BlockPos leftPos=helper.absolutePos(new BlockPos(1,1,1));
                BlockPos bridgePos=helper.absolutePos(new BlockPos(2,1,1));
                BlockPos rightPos=helper.absolutePos(new BlockPos(3,1,1));
                BlockPos sourcePos=helper.absolutePos(new BlockPos(0,1,1));
                BlockPos targetPos=helper.absolutePos(new BlockPos(4,1,1));
                var world=helper.getLevel();
                world.setBlock(sourcePos,net.minecraft.world.level.block.Blocks.CHEST.defaultBlockState(),3);
                world.setBlock(leftPos,ObsidianNetwork.MULTI_CABLE.get().defaultBlockState(),3);
                world.setBlock(bridgePos,ObsidianNetwork.ITEM_CABLE.get().defaultBlockState(),3);
                world.setBlock(rightPos,ObsidianNetwork.MULTI_CABLE.get().defaultBlockState(),3);
                world.setBlock(targetPos,net.minecraft.world.level.block.Blocks.CHEST.defaultBlockState(),3);
                var left=(MultiCableBlockEntity)world.getBlockEntity(leftPos);
                var right=(MultiCableBlockEntity)world.getBlockEntity(rightPos);
                if(!left.has(MultiCableBlockEntity.Layer.ITEM))left.add(MultiCableBlockEntity.Layer.ITEM);
                if(!right.has(MultiCableBlockEntity.Layer.ITEM))right.add(MultiCableBlockEntity.Layer.ITEM);
                left.setLogistics(MultiCableBlockEntity.Layer.ITEM,Direction.WEST,1,0,0);
                right.setLogistics(MultiCableBlockEntity.Layer.ITEM,Direction.EAST,2,0,0);
                var source=(net.minecraft.world.level.block.entity.ChestBlockEntity)world.getBlockEntity(sourcePos);
                var target=(net.minecraft.world.level.block.entity.ChestBlockEntity)world.getBlockEntity(targetPos);
                source.setItem(0,new net.minecraft.world.item.ItemStack(net.minecraft.world.item.Items.DIAMOND,8));
                helper.startSequence().thenExecuteAfter(25,()->{
                  int sourceCount=source.getItem(0).getCount();
                  int targetCount=target.getItem(0).getCount();
                  if(targetCount<=0)throw new IllegalStateException("Mixed original ITEM cable route transferred no diamonds");
                  if(sourceCount+targetCount!=8)throw new IllegalStateException("ITEM conservation failed: "+sourceCount+" + "+targetCount);
                }).thenExecute(()->{
                  // Reuse the physical mixed bridge with real water tanks.
                  world.setBlock(sourcePos,ObsidianNetwork.NETWORK_TANK_64K.get().defaultBlockState(),3);
                  world.setBlock(bridgePos,ObsidianNetwork.FLUID_CABLE.get().defaultBlockState(),3);
                  world.setBlock(targetPos,ObsidianNetwork.NETWORK_TANK_64K.get().defaultBlockState(),3);
                  if(!left.has(MultiCableBlockEntity.Layer.FLUID))left.add(MultiCableBlockEntity.Layer.FLUID);
                  if(!right.has(MultiCableBlockEntity.Layer.FLUID))right.add(MultiCableBlockEntity.Layer.FLUID);
                  left.setLogistics(MultiCableBlockEntity.Layer.FLUID,Direction.WEST,1,0,0);
                  right.setLogistics(MultiCableBlockEntity.Layer.FLUID,Direction.EAST,2,0,0);
                  var tankSource=(dev.obsidiannetwork.blockentity.NetworkTankBlockEntity)world.getBlockEntity(sourcePos);
                  var tankTarget=(dev.obsidiannetwork.blockentity.NetworkTankBlockEntity)world.getBlockEntity(targetPos);
                  var sourceFluid=net.neoforged.neoforge.fluids.capability.IFluidHandler.of(tankSource.tank());
                  int filled=sourceFluid.fill(new net.neoforged.neoforge.fluids.FluidStack(net.minecraft.world.level.material.Fluids.WATER,4000),net.neoforged.neoforge.fluids.capability.IFluidHandler.FluidAction.EXECUTE);
                  if(filled!=4000)throw new IllegalStateException("Cannot fill FLUID source tank: "+filled);
                }).thenExecuteAfter(30,()->{
                  var tankSource=(dev.obsidiannetwork.blockentity.NetworkTankBlockEntity)world.getBlockEntity(sourcePos);
                  var tankTarget=(dev.obsidiannetwork.blockentity.NetworkTankBlockEntity)world.getBlockEntity(targetPos);
                  var sourceFluid=net.neoforged.neoforge.fluids.capability.IFluidHandler.of(tankSource.tank());
                  var targetFluid=net.neoforged.neoforge.fluids.capability.IFluidHandler.of(tankTarget.tank());
                  int a=sourceFluid.getFluidInTank(0).getAmount();
                  int b=targetFluid.getFluidInTank(0).getAmount();
                  if(b<=0)throw new IllegalStateException("Mixed original FLUID route transferred no water");
                  if(a+b!=4000)throw new IllegalStateException("FLUID conservation failed: "+a+" + "+b);
                }).thenExecute(()->{
                  // ENERGY: real EnergyCell -> MultiCable -> standalone ENERGY -> MultiCable -> EnergyCell.
                  world.setBlock(sourcePos,ObsidianNetwork.BASIC_ENERGY_CELL.get().defaultBlockState(),3);
                  world.setBlock(bridgePos,ObsidianNetwork.ENERGY_CABLE.get().defaultBlockState(),3);
                  world.setBlock(targetPos,ObsidianNetwork.BASIC_ENERGY_CELL.get().defaultBlockState(),3);
                  if(!left.has(MultiCableBlockEntity.Layer.ENERGY))left.add(MultiCableBlockEntity.Layer.ENERGY);
                  if(!right.has(MultiCableBlockEntity.Layer.ENERGY))right.add(MultiCableBlockEntity.Layer.ENERGY);
                  var sourceCell=(dev.obsidiannetwork.blockentity.EnergyCellBlockEntity)world.getBlockEntity(sourcePos);
                  var targetCell=(dev.obsidiannetwork.blockentity.EnergyCellBlockEntity)world.getBlockEntity(targetPos);
                  if(sourceCell==null||targetCell==null)throw new IllegalStateException("Missing ENERGY cell fixture");
                  try(var tx=net.neoforged.neoforge.transfer.transaction.Transaction.openRoot()){
                    int inserted=sourceCell.energyHandler(null).insert(8000,tx);
                    if(inserted!=8000)throw new IllegalStateException("ENERGY prefill failed: "+inserted);
                    tx.commit();
                  }
                  sourceCell.cycleSide(Direction.EAST.get3DDataValue());
                  if(sourceCell.sideMode(Direction.EAST)!=dev.obsidiannetwork.blockentity.EnergyCellBlockEntity.SideMode.OUTPUT)
                    throw new IllegalStateException("ENERGY source side is not OUTPUT");
                }).thenExecuteAfter(25,()->{
                  var sourceCell=(dev.obsidiannetwork.blockentity.EnergyCellBlockEntity)world.getBlockEntity(sourcePos);
                  var targetCell=(dev.obsidiannetwork.blockentity.EnergyCellBlockEntity)world.getBlockEntity(targetPos);
                  long a=sourceCell.stored(),b=targetCell.stored();
                  if(b<=0)throw new IllegalStateException("Mixed original ENERGY route transferred no FE");
                  if(a+b!=8000)throw new IllegalStateException("ENERGY conservation failed: "+a+" + "+b);
                }).thenExecute(()->{
                  // NETWORK: controller -> original MultiCable -> standalone NETWORK -> MultiCable -> storage drive.
                  world.setBlock(sourcePos,ObsidianNetwork.NETWORK_CONTROLLER.get().defaultBlockState(),3);
                  world.setBlock(bridgePos,ObsidianNetwork.NETWORK_CABLE.get().defaultBlockState(),3);
                  world.setBlock(targetPos,ObsidianNetwork.STORAGE_DRIVE.get().defaultBlockState(),3);
                  if(!left.has(MultiCableBlockEntity.Layer.NETWORK))left.add(MultiCableBlockEntity.Layer.NETWORK);
                  if(!right.has(MultiCableBlockEntity.Layer.NETWORK))right.add(MultiCableBlockEntity.Layer.NETWORK);
                  for(Direction d:Direction.values()){
                    if(!left.enabled(MultiCableBlockEntity.Layer.NETWORK,d)||!right.enabled(MultiCableBlockEntity.Layer.NETWORK,d))
                      throw new IllegalStateException("Original NETWORK layer missing face "+d);
                  }
                  if(world.getBlockEntity(sourcePos)==null||world.getBlockEntity(targetPos)==null)
                    throw new IllegalStateException("NETWORK controller or storage drive block entity missing");
                  left.setEnabled(MultiCableBlockEntity.Layer.NETWORK,Direction.EAST,false);
                  if(left.enabled(MultiCableBlockEntity.Layer.NETWORK,Direction.EAST))
                    throw new IllegalStateException("NETWORK bridge isolation failed");
                  left.setEnabled(MultiCableBlockEntity.Layer.NETWORK,Direction.EAST,true);
                  if(!left.enabled(MultiCableBlockEntity.Layer.NETWORK,Direction.EAST))
                    throw new IllegalStateException("NETWORK bridge reconnect failed");
                }).thenSucceed();
              }
            }
          }
