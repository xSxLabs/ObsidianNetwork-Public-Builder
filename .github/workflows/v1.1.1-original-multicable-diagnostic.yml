name: v1.1.1 Original MultiCable Runtime Diagnostic
# Independent compile-only legacy restoration probe; never publish as a release.
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1.1.1-original-multicable-diagnostic.yml'
      - 'README.md'
permissions: {contents: read}
# Build 214 energy API trigger
# Build 212 explicit trigger
# Build 215 expanded conduit test trigger
# Build 216 broad conduit semantics trigger
# Build 217 correct centralized priority gate\n# Build 218 real item straight/bent/split/merge GameTests\n# Build 219 capability-backed fluid/energy fixture\n# Build 220 real fluid/energy capability routing\n# Build 221 real NetworkTank fluid GameTest\n# Build 222 bidirectional ENERGY and connection-only NETWORK semantics\n# Build 223 fix legacy runtime ownership gate for no-mode ENERGY\n# Build 225 assert connection-only NETWORK and bidirectional ENERGY runtime\n# Build 226 real server-tick NETWORK/ENERGY no-IO topology GameTest\n# Build 227 tolerate default NETWORK layer and assert resulting topology
# Build 234 ENERGY external faces are capability-connected and have no input/output mode
# Build 236 inspect real Energy Cell API for capability-backed transfer GameTest
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xSxLabs/ObsidianNetwork-Build
          ref: v1.1.1-io-facades-teleporter
          token: '${{ secrets.PRIVATE_SOURCE_TOKEN }}'
          path: private
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - name: Reconstruct v1.0.5 baseline and inspect Importer
        run: |
          set -euo pipefail
          JAR=private/xSxLabs-Network-Storage-0.76.0-rc10.jar
          mkdir -p work/src/main/java work/src/main/resources
          curl -fL --retry 4 -o work/vineflower.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          java -jar work/vineflower.jar "$JAR" work/decompiled
          cp -a work/decompiled/dev work/src/main/java/
          MASTER="$GITHUB_WORKSPACE/$JAR"; (cd work/src/main/resources && jar xf "$MASTER")
          find work/src/main/resources -name '*.class' -delete; rm -f work/src/main/resources/META-INF/MANIFEST.MF
          cat > work/settings.gradle <<'EOF'
          pluginManagement { repositories { gradlePluginPortal() } }
          plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' }
          EOF
          cat > work/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          minecraft_version=26.1.2
          neo_version=26.1.2.106
          mod_id=obsidiannetwork
          mod_version=1.1.1
          mod_group_id=dev.obsidiannetwork
          EOF
          cat > work/build.gradle <<'EOF'
          plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.147' }
          version=mod_version; group=mod_group_id; base { archivesName='xSxLabs-Network-Storage' }
          java.toolchain.languageVersion=JavaLanguageVersion.of(25)
          repositories { maven { url='https://maven.blamejared.com' }; maven { url='https://maven.theillusivec4.top/' } }
          neoForge { version=project.neo_version; mods { obsidiannetwork { sourceSet(sourceSets.main) } } }
          dependencies { compileOnly 'mezz.jei:jei-26.1.2-neoforge:29.5.0.26'; compileOnly 'top.theillusivec4.curios:curios-neoforge:15.0.0+26.1.2:api' }
          tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
          EOF
          export V1_SOURCE_ROOT="$GITHUB_WORKSPACE/work/src/main/java" V1_RESOURCE_ROOT="$GITHUB_WORKSPACE/work/src/main/resources" V1_PROJECT_ROOT="$GITHUB_WORKSPACE/work"
