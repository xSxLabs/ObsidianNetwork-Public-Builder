name: Stresstest Build 106
on:
  workflow_dispatch:
  push:
    branches: [stresstest-build-106]
    paths:
      - '.github/workflows/stresstest-build-106.yml'
      - '.github/stresstest-build-106/**'
permissions:
  actions: read
  contents: read
jobs:
  stress-test:
    name: Stresstest Build 106 (frozen JAR, real NeoForge)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download and validate frozen Build 106 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p server/mods
          gh run download 38216688328 --repo xSxLabs/ObsidianNetwork-Public-Builder --dir /tmp/build106
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,shutil,hashlib
          jars=list(Path('/tmp/build106').rglob('*.jar'))
          assert len(jars)==1, f'Expected one JAR: {jars}'
          jar=jars[0]
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              assert any(n.endswith('LogisticsCableGhostJeiPlugin.class') for n in names)
              assert any(n.endswith('ConduitRuntime.class') for n in names)
          expected='38d9e6ddf7d252af07b84a39012deecf6c98ab0d6101512027c298e4455f42f8'
          actual=hashlib.sha256(jar.read_bytes()).hexdigest()
          assert actual==expected, f'Frozen Build 106 JAR SHA256 mismatch: {actual}'
          shutil.copyfile(jar,'server/mods/network-storage-build-106.jar')
          print('Build 106 SHA256:',hashlib.sha256(jar.read_bytes()).hexdigest())
          PY
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile separate stress fixture only (frozen mod JAR untouched)
        run: |
          set -euo pipefail
          mkdir -p .github/stresstest-build-106/fixture/libs
          cp server/mods/network-storage-build-106.jar .github/stresstest-build-106/fixture/libs/
          gradle -p .github/stresstest-build-106/fixture build --no-daemon
          cp .github/stresstest-build-106/fixture/build/libs/build106-stress-fixture-1.0.jar server/mods/
      - name: Install NeoForge 26.1.2.106 server (no Network Storage compilation)
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 -o /tmp/neoforge-installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/26.1.2.106/neoforge-26.1.2.106-installer.jar
          (cd server && java -jar /tmp/neoforge-installer.jar --installServer)
          echo 'eula=true' > server/eula.txt
          cat > server/server.properties <<'EOF'
          online-mode=false
          enable-rcon=true
          rcon.password=stress106localonly
          rcon.port=25575
          server-port=25565
          max-tick-time=-1
          view-distance=3
          simulation-distance=3
          spawn-protection=0
          difficulty=peaceful
          EOF
      - name: Start server and execute growing-network benchmark
        run: |
          set -euo pipefail
          (cd server && bash run.sh nogui > server.log 2>&1) &
          echo $! > /tmp/stress-server.pid
          timeout 900 bash -c 'while [ ! -s server/transport-results.json ]; do if grep -q BUILD106_ACTIVE_TRANSPORT_PASS server/server.log; then break; fi; if grep -Eq "Exception in server tick loop|BUILD106 ACTIVE STRESS|ModLoadingException|LoadingFailedException" server/server.log; then tail -n 150 server/server.log; exit 1; fi; sleep 3; done'
          test -s server/transport-results.json
          cp server/transport-results.json transport-results.json
          cat transport-results.json | tee stress-results.txt
      - name: Require independently verified active item and fluid transfers
        run: |
          set -euo pipefail
          if [ ! -s server/transport-results.json ]; then
            echo 'FAIL: No active item/fluid transport measurements produced; passive topology benchmarks are insufficient.' >&2
            exit 1
          fi
          python3 .github/stresstest-build-106/verify-active-transfers.py
      - name: Upload raw results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stresstest-build-106-results
          path: |
            stress-results.txt
            stress-results.json
            extended-stress-results.json
            server/transport-results.json
            active-transport-diagnostic.json
            server/server.log
          if-no-files-found: warn
