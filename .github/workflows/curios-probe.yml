name: Probe RC10.1 Curios Basis
on:
  push:
    paths: ['.github/workflows/curios-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: xSxLabs/ObsidianNetwork-Build
          ref: rc41-runtime-fixes
          token: '${{ secrets.PRIVATE_SOURCE_TOKEN }}'
          path: historical
          fetch-depth: 0
      - name: Locate Curios and hotkey source origin
        working-directory: historical
        run: |
          set +e
          echo '=== PLAIN SCRIPT MATCHES ==='
          grep -RIlE 'CuriosTerminalCompat|CurioTerminalOpenHandler|OpenCurioTerminalPayload|ClientKeyBindings' .github/scripts | sort
          echo '=== FIRST HISTORY COMMITS TOUCHING TERMS ==='
          git log --all --reverse -S'CuriosTerminalCompat' --format='%H %s' -- .github/scripts | head -20
          git log --all --reverse -S'OpenCurioTerminalPayload' --format='%H %s' -- .github/scripts | head -20
          echo '=== CONTENT AROUND MATCHES ==='
          grep -RInE 'CuriosTerminalCompat|CurioTerminalOpenHandler|OpenCurioTerminalPayload|ClientKeyBindings' .github/scripts --include='*.py' | head -200
          exit 1
