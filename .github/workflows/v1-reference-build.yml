name: v1 Reference Compile
on:
  workflow_dispatch:
  push:
    paths: ['.github/V1_REFERENCE_TRIGGER','.github/workflows/v1-reference-build.yml']
permissions: {contents: read}
concurrency: {group: xsxlabs-v1-reference, cancel-in-progress: false}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xSxLabs/ObsidianNetwork-Build
          ref: v1.0-work
          token: '${{ secrets.PRIVATE_SOURCE_TOKEN }}'
          path: private
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.7.1'}
      - name: Verify immutable master
        shell: bash
        run: |
          set -euo pipefail
          JAR=private/xSxLabs-Network-Storage-0.76.0-rc10.jar
          test "$(stat -c%s "$JAR")" = 1121869
          test "$(sha256sum "$JAR" | cut -d' ' -f1)" = b98030bce849f5f947eb9c72f94d6ac94880117d672a549040586f03c36f8287
      - name: Reconstruct source from master only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/src/main/java work/src/main/resources
          curl -fL --retry 4 -o work/vineflower.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          java -jar work/vineflower.jar private/xSxLabs-Network-Storage-0.76.0-rc10.jar work/decompiled
          cp -a work/decompiled/dev work/src/main/java/
          MASTER="$GITHUB_WORKSPACE/private/xSxLabs-Network-Storage-0.76.0-rc10.jar"
          (cd work/src/main/resources && jar xf "$MASTER")
          find work/src/main/resources -type f -name '*.class' -delete
          rm -f work/src/main/resources/META-INF/MANIFEST.MF
          V1_SOURCE_ROOT="$GITHUB_WORKSPACE/work/src/main/java" python3 private/reconstruction/apply-baseline-fixes.py
          V1_SOURCE_ROOT="$GITHUB_WORKSPACE/work/src/main/java" python3 private/fixes/apply-fix-01-energy-cell-persistence.py
          V1_SOURCE_ROOT="$GITHUB_WORKSPACE/work/src/main/java" python3 private/fixes/apply-fix-02-solar-atomic-transfer.py
          V1_SOURCE_ROOT="$GITHUB_WORKSPACE/work/src/main/java" python3 private/fixes/apply-fix-03-wireless-open-refund.py
          cat > work/settings.gradle <<'EOF'
          pluginManagement { repositories { gradlePluginPortal() } }
          plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' }
          EOF
          cat > work/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          minecraft_version=26.1.2
          neo_version=26.1.2.106
          mod_id=obsidiannetwork
          mod_version=1.0
          mod_group_id=dev.obsidiannetwork
          EOF
          cat > work/build.gradle <<'EOF'
          plugins {
            id 'java-library'
            id 'net.neoforged.moddev' version '2.0.147'
          }
          version = mod_version
          group = mod_group_id
          base { archivesName = 'xSxLabs-Network-Storage' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(25)
          repositories {
            maven { url = 'https://maven.blamejared.com' }
            maven { url = 'https://maven.theillusivec4.top/' }
          }
          neoForge {
            version = project.neo_version
            mods { obsidiannetwork { sourceSet(sourceSets.main) } }
          }
          dependencies {
            compileOnly 'mezz.jei:jei-26.1.2-neoforge:29.5.0.26'
            compileOnly 'top.theillusivec4.curios:curios-neoforge:15.0.0-beta.2+26.1.2:api'
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          EOF
          echo "java=$(find work/src/main/java -name '*.java' | wc -l) resources=$(find work/src/main/resources -type f | wc -l)"
      - name: Compile fixes 01-03
        working-directory: work
        run: gradle --no-daemon --no-configuration-cache clean build --stacktrace
      - name: No-regression inventory and fix verification
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(find work/build/libs -type f -name '*.jar' ! -name '*sources*' -print -quit)
          test -n "$OUT"
          unzip -t "$OUT" >/dev/null
          jar tf "$OUT" | sort > /tmp/out-all.list
          MASTER=private/xSxLabs-Network-Storage-0.76.0-rc10.jar
          jar tf "$MASTER" | sort > /tmp/master-all.list
          for p in dev/obsidiannetwork/block/EnergyCellBlock.class dev/obsidiannetwork/block/SolarGeneratorBlock.class dev/obsidiannetwork/blockentity/SolarGeneratorBlockEntity.class dev/obsidiannetwork/block/AutocrafterBlock.class dev/obsidiannetwork/block/CraftingMonitorBlock.class dev/obsidiannetwork/block/TemplateManagerBlock.class dev/obsidiannetwork/client/ClientKeyBindings.class dev/obsidiannetwork/network/OpenCurioTerminalPayload.class dev/obsidiannetwork/item/WirelessCraftingTerminalItem.class; do
            grep -Fqx "$p" /tmp/out-all.list || { echo "Missing required class: $p"; exit 1; }
          done
          for prefix in assets/obsidiannetwork/ data/obsidiannetwork/; do
            awk -v p="$prefix" 'index($0,p)==1' /tmp/master-all.list > /tmp/master-prefix.list
            awk -v p="$prefix" 'index($0,p)==1' /tmp/out-all.list > /tmp/built-prefix.list
            comm -23 /tmp/master-prefix.list /tmp/built-prefix.list > /tmp/missing
            if test -s /tmp/missing; then echo "Missing resources under $prefix"; cat /tmp/missing; exit 1; fi
          done
          javap -classpath "$OUT" -c dev.obsidiannetwork.block.EnergyCellBlock > /tmp/energycell.javap
          grep -Fq 'BLOCK_ENTITY_DATA' /tmp/energycell.javap || { echo 'Fix 01 verification failed: BLOCK_ENTITY_DATA not present'; exit 1; }
          SOLAR=work/src/main/java/dev/obsidiannetwork/blockentity/SolarGeneratorBlockEntity.java
          grep -Fq 'SnapshotJournal' "$SOLAR" || { echo 'Fix 02 verification failed: SnapshotJournal missing'; exit 1; }
          grep -Fq 'be.energyJournal.updateSnapshots(tx)' "$SOLAR" || { echo 'Fix 02 verification failed: energyJournal update missing'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          s=Path('work/src/main/java/dev/obsidiannetwork/blockentity/SolarGeneratorBlockEntity.java').read_text()
          j=s.find('be.energyJournal.updateSnapshots(tx)')
          e=s.find('be.energy.extract(accepted)', j)
          c=s.find('tx.commit()', e)
          assert j >= 0 and e >= 0 and c >= 0 and j < e < c, f'solar journal/extract/commit ordering invalid: journal={j} extract={e} commit={c}'
          assert s.find('tx.commit();\n                           long extracted = be.energy.extract(accepted);') < 0, 'unsafe solar commit-before-extract sequence still present'
          w=Path('work/src/main/java/dev/obsidiannetwork/item/WirelessCraftingTerminalItem.java').read_text()
          close=w.find('WorldTopologyBridge.closeTerminal(access.level(), sp, terminalId, sessionId);')
          refund=w.find('runtime.energy().receive(OPEN_COST);', close)
          fail=w.find('return InteractionResult.FAIL;', refund)
          assert close >= 0 and refund >= 0 and fail >= 0 and close < refund < fail, 'Fix 03 failed-open refund ordering invalid'
          PY
          javap -classpath "$OUT" -c -p dev.obsidiannetwork.blockentity.SolarGeneratorBlockEntity > /tmp/solar.javap
          javap -classpath "$OUT" -c -p dev.obsidiannetwork.item.WirelessCraftingTerminalItem > /tmp/wireless.javap
          grep -Fq 'EnergyBuffer.receive' /tmp/wireless.javap || { echo 'Fix 03 verification failed: refund call absent from bytecode'; exit 1; }
          echo "FIXES 01-03 PASS: $OUT"
          sha256sum "$OUT"
