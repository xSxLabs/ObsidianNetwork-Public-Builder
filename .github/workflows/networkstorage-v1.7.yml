            private static final class MixedStandaloneBundleTest extends GameTestInstance {
              MixedStandaloneBundleTest(TestData<net.minecraft.core.Holder<TestEnvironmentDefinition<?>>> data){super(data);}
              @Override public com.mojang.serialization.MapCodec<? extends GameTestInstance> codec(){throw new UnsupportedOperationException("CI-only test");}
              @Override protected net.minecraft.network.chat.MutableComponent typeDescription(){return Component.literal("Standalone-bundle-standalone ITEM transfer");}
              @Override public void run(GameTestHelper h){
                BlockPos source=h.absolutePos(new BlockPos(0,1,1)),input=h.absolutePos(new BlockPos(1,1,1)),middle=h.absolutePos(new BlockPos(2,1,1)),output=h.absolutePos(new BlockPos(3,1,1)),target=h.absolutePos(new BlockPos(4,1,1));
                h.getLevel().setBlock(source,Blocks.CHEST.defaultBlockState(),3);
                h.getLevel().setBlock(input,ObsidianNetwork.ITEM_CABLE.get().defaultBlockState(),3);
                h.getLevel().setBlock(middle,ObsidianNetwork.CONDUIT_BUNDLE.get().defaultBlockState(),3);
                h.getLevel().setBlock(output,ObsidianNetwork.ITEM_CABLE.get().defaultBlockState(),3);
                h.getLevel().setBlock(target,Blocks.CHEST.defaultBlockState(),3);
                var bundle=(ConduitBundleBlockEntity)h.getLevel().getBlockEntity(middle);
                if(!bundle.has(ConduitBundleBlockEntity.Layer.ITEM)&&!bundle.add(ConduitBundleBlockEntity.Layer.ITEM))throw new IllegalStateException("BUILD151: bundle ITEM layer missing");
                var in=(dev.obsidiannetwork.blockentity.LogisticsCableBlockEntity)h.getLevel().getBlockEntity(input);
                var out=(dev.obsidiannetwork.blockentity.LogisticsCableBlockEntity)h.getLevel().getBlockEntity(output);
                in.setMode(Direction.WEST,dev.obsidiannetwork.blockentity.LogisticsCableBlockEntity.Mode.IMPORT);
                out.setMode(Direction.EAST,dev.obsidiannetwork.blockentity.LogisticsCableBlockEntity.Mode.EXPORT);
                var from=(net.minecraft.world.level.block.entity.ChestBlockEntity)h.getLevel().getBlockEntity(source);
                from.setItem(0,new net.minecraft.world.item.ItemStack(net.minecraft.world.item.Items.DIAMOND,8));
                h.startSequence().thenExecuteAfter(40,()->{
                  var to=(net.minecraft.world.level.block.entity.ChestBlockEntity)h.getLevel().getBlockEntity(target);
                  if(to.getItem(0).getCount()<=0)throw new IllegalStateException("BUILD151: standalone-bundle-standalone ITEM transfer failed");
                  if(from.getItem(0).getCount()+to.getItem(0).getCount()!=8)throw new IllegalStateException("BUILD151: ITEM transfer lost or duplicated diamonds");
                  int delivered=to.getItem(0).getCount();
                  h.getLevel().setBlock(middle,Blocks.AIR.defaultBlockState(),3);
                  from.setItem(0,new net.minecraft.world.item.ItemStack(net.minecraft.world.item.Items.DIAMOND,8));
                  h.startSequence().thenExecuteAfter(40,()->{
                    if(to.getItem(0).getCount()!=delivered)throw new IllegalStateException("BUILD153: disconnected mixed ITEM bridge still transferred");
                    if(from.getItem(0).getCount()!=8)throw new IllegalStateException("BUILD153: disconnected mixed ITEM bridge consumed source");
                    h.getLevel().setBlock(middle,ObsidianNetwork.CONDUIT_BUNDLE.get().defaultBlockState(),3);
                    var rejoined=(ConduitBundleBlockEntity)h.getLevel().getBlockEntity(middle);
                    if(!rejoined.has(ConduitBundleBlockEntity.Layer.ITEM)&&!rejoined.add(ConduitBundleBlockEntity.Layer.ITEM))throw new IllegalStateException("BUILD155: ITEM bridge restore failed");
                    h.startSequence().thenExecuteAfter(40,()->{
                      if(to.getItem(0).getCount()<=delivered)throw new IllegalStateException("BUILD155: reconnected mixed ITEM bridge did not resume");
                      if(from.getItem(0).getCount()+to.getItem(0).getCount()!=8+delivered)throw new IllegalStateException("BUILD155: ITEM reconnect lost or duplicated diamonds");
                      h.succeed();
                    });
                  });
                });
              }
            }

