                  if(from.getFluidInTank(0).getAmount()+to.getFluidInTank(0).getAmount()!=4000)throw new IllegalStateException("BUILD152: FLUID transfer lost or duplicated water");
                  int delivered=to.getFluidInTank(0).getAmount();
                  h.getLevel().setBlock(middle,Blocks.AIR.defaultBlockState(),3);
                  from.fill(new net.neoforged.neoforge.fluids.FluidStack(net.minecraft.world.level.material.Fluids.WATER,4000),net.neoforged.neoforge.fluids.capability.IFluidHandler.FluidAction.EXECUTE);
                  int sourceAfterDisconnect=from.getFluidInTank(0).getAmount();
                  h.startSequence().thenExecuteAfter(40,()->{
                    if(to.getFluidInTank(0).getAmount()!=delivered)throw new IllegalStateException("BUILD154: disconnected mixed FLUID bridge still transferred");
                    if(from.getFluidInTank(0).getAmount()!=sourceAfterDisconnect)throw new IllegalStateException("BUILD154: disconnected mixed FLUID bridge drained source");
                    h.getLevel().setBlock(middle,ObsidianNetwork.CONDUIT_BUNDLE.get().defaultBlockState(),3);
                    var rejoined=(ConduitBundleBlockEntity)h.getLevel().getBlockEntity(middle);
                    if(!rejoined.has(ConduitBundleBlockEntity.Layer.FLUID)&&!rejoined.add(ConduitBundleBlockEntity.Layer.FLUID))throw new IllegalStateException("BUILD156: FLUID bridge restore failed");
                    h.startSequence().thenExecuteAfter(40,()->{
                      if(to.getFluidInTank(0).getAmount()<=delivered)throw new IllegalStateException("BUILD156: reconnected mixed FLUID bridge did not resume");
                      if(from.getFluidInTank(0).getAmount()+to.getFluidInTank(0).getAmount()!=sourceAfterDisconnect+delivered)throw new IllegalStateException("BUILD156: FLUID reconnect lost or duplicated water");
                      h.succeed();
                    });
                  });
                });
              }
            }

