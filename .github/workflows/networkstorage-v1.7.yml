                var right=(ConduitBundleBlockEntity)helper.getLevel().getBlockEntity(b);
                if(!left.has(ConduitBundleBlockEntity.Layer.ITEM)) check(left.add(ConduitBundleBlockEntity.Layer.ITEM),"mixed left ITEM");
                if(!right.has(ConduitBundleBlockEntity.Layer.ITEM)) check(right.add(ConduitBundleBlockEntity.Layer.ITEM),"mixed right ITEM");
                var type=dev.obsidiannetwork.conduit.ConduitType.ITEM;
                var connected=dev.obsidiannetwork.conduit.ConduitRuntime.mixedPositions((net.minecraft.server.level.ServerLevel)helper.getLevel(),a,type);
                check(connected.contains(mid)&&connected.contains(b),"mixed ITEM standalone bridge topology");
                BlockPos sourcePos=helper.absolutePos(new BlockPos(0,1,1));
                BlockPos targetPos=helper.absolutePos(new BlockPos(4,1,1));
                helper.getLevel().setBlock(sourcePos,Blocks.CHEST.defaultBlockState(),3);
                helper.getLevel().setBlock(targetPos,Blocks.CHEST.defaultBlockState(),3);
                var source=(net.minecraft.world.level.block.entity.ChestBlockEntity)helper.getLevel().getBlockEntity(sourcePos);
                var target=(net.minecraft.world.level.block.entity.ChestBlockEntity)helper.getLevel().getBlockEntity(targetPos);
                left.setConduitFlags(ConduitBundleBlockEntity.Layer.ITEM,Direction.WEST,false,true);
                right.setConduitFlags(ConduitBundleBlockEntity.Layer.ITEM,Direction.EAST,true,false);
                source.setItem(0,new net.minecraft.world.item.ItemStack(net.minecraft.world.item.Items.DIAMOND,8));
                helper.startSequence().thenExecuteAfter(15,()->{
                  check(target.getItem(0).getCount()>0,"mixed ITEM bundle-standalone-bundle actual transfer");
                  helper.getLevel().setBlock(mid,Blocks.AIR.defaultBlockState(),3);
                  var split=dev.obsidiannetwork.conduit.ConduitRuntime.mixedPositions((net.minecraft.server.level.ServerLevel)helper.getLevel(),a,type);
                  check(!split.contains(b),"mixed ITEM bridge removal splits network");
                  // Repeat the physical bridge check for FLUID, including a split.
                  helper.getLevel().setBlock(mid,ObsidianNetwork.FLUID_CABLE.get().defaultBlockState(),3);
                  if(!left.has(ConduitBundleBlockEntity.Layer.FLUID))check(left.add(ConduitBundleBlockEntity.Layer.FLUID),"mixed left FLUID");
                  if(!right.has(ConduitBundleBlockEntity.Layer.FLUID))check(right.add(ConduitBundleBlockEntity.Layer.FLUID),"mixed right FLUID");
                  var fluidType=dev.obsidiannetwork.conduit.ConduitType.FLUID;
                  var fluidPath=dev.obsidiannetwork.conduit.ConduitRuntime.mixedPositions((net.minecraft.server.level.ServerLevel)helper.getLevel(),a,fluidType);
                  check(fluidPath.contains(mid)&&fluidPath.contains(b),"mixed FLUID standalone bridge topology");
                  helper.getLevel().setBlock(sourcePos,ObsidianNetwork.NETWORK_TANK_64K.get().defaultBlockState(),3);
                  helper.getLevel().setBlock(targetPos,ObsidianNetwork.NETWORK_TANK_64K.get().defaultBlockState(),3);
                  left.setConduitFlags(ConduitBundleBlockEntity.Layer.FLUID,Direction.WEST,false,true);
                  right.setConduitFlags(ConduitBundleBlockEntity.Layer.FLUID,Direction.EAST,true,false);
                  var fluidSource=(dev.obsidiannetwork.blockentity.NetworkTankBlockEntity)helper.getLevel().getBlockEntity(sourcePos);
                  var fluidTarget=(dev.obsidiannetwork.blockentity.NetworkTankBlockEntity)helper.getLevel().getBlockEntity(targetPos);
                  var input=net.neoforged.neoforge.fluids.capability.IFluidHandler.of(fluidSource.tank());
                  check(input.fill(new net.neoforged.neoforge.fluids.FluidStack(net.minecraft.world.level.material.Fluids.WATER,4000),net.neoforged.neoforge.fluids.capability.IFluidHandler.FluidAction.EXECUTE)==4000,"mixed FLUID source fill");
                  helper.startSequence().thenExecuteAfter(20,()->{
                    var output=net.neoforged.neoforge.fluids.capability.IFluidHandler.of(fluidTarget.tank());
                    check(output.getFluidInTank(0).getAmount()>0,"mixed FLUID actual water transfer");
                    check(input.getFluidInTank(0).getAmount()<4000,"mixed FLUID source decreases");
                    helper.getLevel().setBlock(mid,Blocks.AIR.defaultBlockState(),3);
                    var fluidSplit=dev.obsidiannetwork.conduit.ConduitRuntime.mixedPositions((net.minecraft.server.level.ServerLevel)helper.getLevel(),a,fluidType);
                    check(!fluidSplit.contains(b),"mixed FLUID bridge removal splits network");
                    helper.succeed();
                  });
                });
              }
