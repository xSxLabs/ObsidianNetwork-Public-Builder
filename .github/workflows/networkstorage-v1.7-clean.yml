            private static final class StateMachineTest extends GameTestInstance {
              StateMachineTest(TestData<net.minecraft.core.Holder<TestEnvironmentDefinition<?>>> data) { super(data); }

              @Override public void run(GameTestHelper helper) {
                BlockPos src=helper.absolutePos(new BlockPos(1,1,0));
                BlockPos cable=helper.absolutePos(new BlockPos(1,1,1));
                BlockPos dst=helper.absolutePos(new BlockPos(1,1,2));
                helper.getLevel().setBlock(src,Blocks.CHEST.defaultBlockState(),3);
                helper.getLevel().setBlock(cable,ObsidianNetwork.CONDUIT_BUNDLE.get().defaultBlockState(),3);
                helper.getLevel().setBlock(dst,Blocks.CHEST.defaultBlockState(),3);
                var source=(net.minecraft.world.level.block.entity.ChestBlockEntity)helper.getLevel().getBlockEntity(src);
                var sink=(net.minecraft.world.level.block.entity.ChestBlockEntity)helper.getLevel().getBlockEntity(dst);
                var bundle=(ConduitBundleBlockEntity)helper.getLevel().getBlockEntity(cable);
                check(bundle.add(ConduitBundleBlockEntity.Layer.ITEM),"install ITEM conduit");
                bundle.setConduitFlags(ConduitBundleBlockEntity.Layer.ITEM,Direction.NORTH,false,true);
                bundle.setConduitFlags(ConduitBundleBlockEntity.Layer.ITEM,Direction.SOUTH,true,false);
                check(bundle.conduitCanExtract(ConduitBundleBlockEntity.Layer.ITEM,Direction.NORTH),"source side extract");
                check(bundle.conduitCanInsert(ConduitBundleBlockEntity.Layer.ITEM,Direction.SOUTH),"sink side insert");
                source.setItem(0,new net.minecraft.world.item.ItemStack(net.minecraft.world.item.Items.COBBLESTONE,8));
                helper.startSequence()
                  .thenExecuteAfter(10,()->check(sink.getItem(0).getCount()>0,"ITEM server-tick transfer chest-to-chest"))
                  .thenExecute(()->{
                    // Simulate deserialization of the saved ITEM side flags into a fresh
                    // runtime node and verify that transport still works after reload.
                    var level=(net.minecraft.server.level.ServerLevel)helper.getLevel();
                    var before=bundle.conduitNode(dev.obsidiannetwork.conduit.ConduitType.ITEM);
                    check(before.config(Direction.NORTH).extract(),"pre-reload source node extract");
                    check(before.config(Direction.SOUTH).insert(),"pre-reload sink node insert");
                    var tag=bundle.saveWithFullMetadata(level.registryAccess());
                    // Reproduce older worlds: mode is saved but mc_flags_item is absent.
                    // Input must remain extract and output must remain insert.
                    check(tag.contains("mc_item_mode"),"ITEM legacy mode persisted before reload");
                    tag.remove("mc_flags_item");
