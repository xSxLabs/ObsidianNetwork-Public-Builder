            private static final class FullEquipmentCellTest extends GameTestInstance {
              FullEquipmentCellTest(TestData<net.minecraft.core.Holder<TestEnvironmentDefinition<?>>> data) { super(data); }
              @Override public com.mojang.serialization.MapCodec<? extends GameTestInstance> codec() { throw new UnsupportedOperationException("CI-only equipment cell test"); }
              @Override protected net.minecraft.network.chat.MutableComponent typeDescription() { return Component.literal("Full equipment cell remove and reinsert"); }
              @Override public void run(GameTestHelper h) {
                var level=(net.minecraft.server.level.ServerLevel)h.getLevel();
                var pos=h.absolutePos(new BlockPos(2,1,2));
                level.setBlock(pos,ObsidianNetwork.STORAGE_DRIVE.get().defaultBlockState(),3);
                var drive=(dev.obsidiannetwork.blockentity.StorageDriveBlockEntity)level.getBlockEntity(pos);
                net.minecraft.world.item.Item cellItem=null;
                for(var candidate:net.minecraft.core.registries.BuiltInRegistries.ITEM)
                  if(candidate instanceof dev.obsidiannetwork.item.EquipmentCellItem){cellItem=candidate;break;}
                if(cellItem==null)throw new IllegalStateException("Equipment cell not registered");
                var item=(dev.obsidiannetwork.item.EquipmentCellItem)cellItem;
                var store=new dev.obsidiannetwork.core.EquipmentCellStore();
                var key=dev.obsidiannetwork.core.ItemKey.ofCanonicalComponents("minecraft:diamond_sword",new byte[0]);
                // Stress distinct equipment descriptors, not only a single 64k stack.
                for(int i=0;i<256;i++){
                  byte[] descriptor=java.nio.ByteBuffer.allocate(4).putInt(i).array();
                  var distinct=dev.obsidiannetwork.core.ItemKey.ofCanonicalComponents("minecraft:diamond_sword",descriptor);
                  if(store.insertExact(distinct,descriptor,1L)!=1L)throw new IllegalStateException("Equipment descriptor fill failed");
                }
                long filled=store.insertExact(key,new byte[0],63744L);
                if(filled!=63744L||store.free()!=0)throw new IllegalStateException("Equipment cell not full");
                var stack=new net.minecraft.world.item.ItemStack(cellItem);
                item.writeStore(stack,store);
                long start=System.nanoTime();
                long insertNs=0L,removeNs=0L,decodeNs=0L;
                long maxInsertNs=0L,maxRemoveNs=0L,maxDecodeNs=0L;
                for(int cycle=0;cycle<25;cycle++){
                  long t=System.nanoTime();
                  if(!drive.insertCellAt(0,stack))throw new IllegalStateException("Full equipment cell insert failed cycle="+cycle);
                  long elapsedInsert=System.nanoTime()-t; insertNs+=elapsedInsert; maxInsertNs=Math.max(maxInsertNs,elapsedInsert);
                  t=System.nanoTime();
                  var removed=drive.removeCellAt(0);
                  long elapsedRemove=System.nanoTime()-t; removeNs+=elapsedRemove; maxRemoveNs=Math.max(maxRemoveNs,elapsedRemove);
                  if(removed.isEmpty())throw new IllegalStateException("Full equipment cell removal failed cycle="+cycle);
                  t=System.nanoTime();
                  var decoded=item.readStore(removed);
                  long elapsedDecode=System.nanoTime()-t; decodeNs+=elapsedDecode; maxDecodeNs=Math.max(maxDecodeNs,elapsedDecode);
                  if(decoded.amount(key)!=63744L||decoded.types()!=257)throw new IllegalStateException("Equipment cell data lost cycle="+cycle);
                  // Conservation: inspect every distinct descriptor, not just type count.
                  for(int descriptorIndex=0;descriptorIndex<256;descriptorIndex++){
                    byte[] expectedDescriptor=java.nio.ByteBuffer.allocate(4).putInt(descriptorIndex).array();
                    var expectedKey=dev.obsidiannetwork.core.ItemKey.ofCanonicalComponents("minecraft:diamond_sword",expectedDescriptor);
                    if(decoded.amount(expectedKey)!=1L)throw new IllegalStateException("Equipment descriptor content lost cycle="+cycle+" index="+descriptorIndex);
                  }
                  stack=removed;
                }
                long elapsed=System.nanoTime()-start;
                System.out.println("FULL_EQUIPMENT_CELL_PHASE_NS insert="+insertNs+" remove="+removeNs+" decode="+decodeNs+" max_insert="+maxInsertNs+" max_remove="+maxRemoveNs+" max_decode="+maxDecodeNs+" cycles=25 types=257");
                System.out.println("FULL_EQUIPMENT_CELL_REINSERT_NS "+elapsed+" cycles=25 count=64000 types=257");
                h.succeed();
              }
            }

