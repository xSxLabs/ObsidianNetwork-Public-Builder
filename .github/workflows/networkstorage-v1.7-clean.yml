                        if(rt.storage().cells().stream().mapToLong(c->c.amount(stone)).sum()!=37655L)
                          throw new IllegalStateException("50-drive post-reconnect churn lost stone");
                        System.out.println("REAL_50_DRIVE_POST_RECONNECT_CHURN operations=2000 elapsed_ns="+elapsedNanos+" no_TPS_claim=true");
                        // Multi-sample measured throughput; each sample conserves all items.
                        long[] samples=new long[9];
                        for(int trial=0;trial<samples.length;trial++){
                          long sampleStart=System.nanoTime();
                          for(int operation=0;operation<1000;operation++){
                            if(rt.storage().insert(stone,64L)!=64L||rt.storage().extract(stone,64L)!=64L)
                              throw new IllegalStateException("50-drive benchmark transfer failed at trial "+trial);
                          }
                          samples[trial]=System.nanoTime()-sampleStart;
                        }
                        java.util.Arrays.sort(samples);
                        System.out.println("REAL_50_DRIVE_BENCHMARK_V1 cells=800 drives=50 trials=9 operations_per_trial=2000"+
                            " median_ns="+samples[4]+" p90_ns="+samples[8]+
                            " min_ns="+samples[0]+" total_operations=18000");
                        if(rt.storage().cells().stream().mapToLong(c->c.amount(stone)).sum()!=37655L)
                          throw new IllegalStateException("50-drive benchmark item conservation failed");
                        // Force all 800 physical cells to participate in the transfer test.
                        int populated=0;
                        long bulkStart=System.nanoTime();
                        for(var cell:rt.storage().cells()){
                          // Full cells cannot accept another item: cycle an existing key instead.
                          var entries=cell.snapshot();
                          var key=entries.isEmpty()?iron:entries.keySet().iterator().next();
                          if(entries.isEmpty()){
                            if(cell.insert(key,1L)!=1L||cell.extract(key,1L)!=1L)
                              throw new IllegalStateException("50-drive empty-cell write/extract failed at "+populated);
                          }else{
                            if(cell.extract(key,1L)!=1L||cell.insert(key,1L)!=1L)
                              throw new IllegalStateException("50-drive occupied-cell extract/write failed at "+populated);
                          }
                          populated++;
                        }
                        if(populated!=800)throw new IllegalStateException("Expected 800 real cell mutation cycles");
                        int drained=populated;
                        if(rt.storage().cells().stream().mapToLong(c->c.amount(iron)).sum()!=22655L||
                           rt.storage().cells().stream().mapToLong(c->c.amount(stone)).sum()!=37655L)
                          throw new IllegalStateException("50-drive per-cell conservation failed");
                        System.out.println("REAL_50_DRIVE_ALL_CELLS operations=1600 cells=800 elapsed_ns="+(System.nanoTime()-bulkStart));
                        // Sample elapsed wall time across real server tick boundaries.
                        final long[] tickWall={System.nanoTime()};
                        final int[] tickSamples={0};
                        final long[] storageTickWorkNs=new long[20];
                        var sampleSequence=h.startSequence();
                        for(int tick=0;tick<20;tick++){
                          sampleSequence.thenExecuteAfter(1,()->{
                            long now=System.nanoTime();
                            long delta=now-tickWall[0];
                            if(delta<0)throw new IllegalStateException("Non-monotonic server tick clock");
                            tickWall[0]=now;
                            tickSamples[0]++;
                            // Execute bounded real storage work on each of 20 distinct
                            // server ticks rather than only a one-tick benchmark burst.
                            long workStart=System.nanoTime();
                            for(int operation=0;operation<100;operation++){
                              if(rt.storage().insert(stone,64L)!=64L||rt.storage().extract(stone,64L)!=64L)
                                throw new IllegalStateException("50-drive sustained tick transfer failed at "+tickSamples[0]+":"+operation);
                            }
                            long workNanos=System.nanoTime()-workStart;
                            storageTickWorkNs[tickSamples[0]-1]=workNanos;
                            System.out.println("REAL_50_DRIVE_SUSTAINED_TICK sample="+tickSamples[0]+" operations=200 storage_work_ns="+workNanos+" tick_wall_ns="+delta+" wall_clock_not_MSPT=true");
                          });
                        }
                        sampleSequence.thenExecute(()->{
                          if(tickSamples[0]!=20)throw new IllegalStateException("Expected 20 server tick samples");
                          java.util.Arrays.sort(storageTickWorkNs);
                          long p95=storageTickWorkNs[18];
                          long worst=storageTickWorkNs[19];
                          System.out.println("REAL_50_DRIVE_SUSTAINED_SUMMARY ticks=20 operations=4000 p95_storage_work_ns="+p95+" worst_storage_work_ns="+worst+" not_server_MSPT=true");
                          if(rt.storage().cells().stream().mapToLong(c->c.amount(stone)).sum()!=37655L)
                            throw new IllegalStateException("50-drive sustained tick conservation failed");
                          if(p95>50_000_000L)
                            throw new IllegalStateException("50-drive sustained storage p95 exceeds 50ms budget: "+p95+"ns");
                          h.succeed();
                        });

                      });
                    });

                  });
                });
              }
            }

