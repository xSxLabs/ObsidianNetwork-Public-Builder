name: Runner Diagnostic ubuntu-24.04
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-diagnostic-ubuntu2404.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Runner info
        run: |
          echo "runner=$RUNNER_NAME"
          echo "os=$RUNNER_OS"
          uname -a
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Java info
        run: java -version
