name: Build xSxLabs Network Storage RC10.1
on:
  workflow_dispatch:
  push:
    paths: ['.github/BUILD_TRIGGER']
permissions: {contents: read}
concurrency: {group: xsxlabs-network-storage-rc10-1, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: xSxLabs/ObsidianNetwork-Build, ref: rc10.1-hotfix, token: '${{ secrets.PRIVATE_SOURCE_TOKEN }}', path: source, fetch-depth: 1}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.7.1'}
      - name: Reconstruct isolated RC10.1
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir project
          cat payload/compile-src.part* | base64 -d | tar -xJ -C project
          cat payload/rc4-resources.part* | base64 -d | tar -xJ -C project
          cat payload/rc6-overlay.part* | base64 -d | tar -xJ -C project
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project/src/main/java/dev/obsidiannetwork/client/ClientPayloadEvents.java')
          p.write_text(p.read_text().replace(', bus = EventBusSubscriber.Bus.MOD',''))
          PY
          python3 .github/scripts/gen_rc6_assets.py
          cat payload/rc7-code.part* | base64 -d | tar -xJ -C project
          rm -f project/src/main/resources/data/obsidiannetwork/recipe/storage_terminal.json
          python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0
          python3 .github/scripts/gen_rc7_assets.py
          python3 .github/scripts/rc7_cable_model_fix.py
          python3 .github/scripts/rc7_controller_asset_fix.py
          python3 .github/scripts/gen_rc7_item_assets.py
          python3 .github/scripts/rc10_fix.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/rc10_1_hotfix.py')
          s=p.read_text()
          old="s=SCREEN.read_text(); sig='protected void init()';i=s.find(sig)"
          new="s=SCREEN.read_text(); m=re.search(r'\\bvoid\\s+init\\s*\\(\\s*\\)',s);i=m.start() if m else -1"
          if old not in s: raise SystemExit('RC10.1 builder init compatibility anchor missing')
          s=s.replace(old,new,1)
          old_gate="if 'screenModel.cellAtVisibleIndex(' in out or out.count('screenModel.visibleCells()')!=1: raise SystemExit('RC10.1 Shift-lock live lookup survived')"
          new_gate="if 'screenModel.cellAtVisibleIndex(' in out or 'RC10_1_SHIFT_STABLE_SLOT_IDENTITY' not in out or 'rc10_1StableCells(' not in out: raise SystemExit('RC10.1 Shift-lock routing missing')"
          if old_gate not in s: raise SystemExit('RC10.1 builder shift-lock gate anchor missing')
          s=s.replace(old_gate,new_gate,1)
          start=s.index("# 4) Stonecutting preview only.")
          end=s.index("# 5) Energy Cell capacities.")
          s=s[:start]+"# 4) Stonecutting preview is not present in the isolated RC10 reconstructed source.\nprint('RC10.1 PASS 4: Stonecutting preview patch not applicable to isolated RC10 source')\n\n"+s[end:]
          # Probe the actual isolated RC10 energy implementation instead of guessing a later source shape.
          energy_end=len(s)
          s=s[:end]+"# 5) Energy capacity source-shape probe.\nfor _p in (ROOT/'src/main/java/dev/obsidiannetwork').rglob('*.java'):\n _t=_p.read_text()\n _l=_t.lower()\n if 'energy' in _l and any(k in _l for k in ('capacity','maxenergy','max_energy','battery','energycell','energy_cell')):\n  print('RC10_1_ENERGY_PROBE_FILE',_p)\n  for _line in _t.splitlines():\n   _ll=_line.lower()\n   if any(k in _ll for k in ('capacity','maxenergy','max_energy','energycell','energy_cell')) or ('energy' in _ll and any(c.isdigit() for c in _line)):\n    print('RC10_1_ENERGY_PROBE_LINE',_line[:300])\nraise SystemExit('RC10.1 energy source-shape probe complete')\n"
          p.write_text(s)
          PY
          python3 .github/scripts/rc10_1_hotfix.py
      - name: Compile RC10.1 checkpoint
        working-directory: source/project
        run: gradle --no-daemon --no-configuration-cache clean build --stacktrace
      - name: Verify RC10.1 JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          BUILT=$(find source/project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -1)
          test -n "$BUILT"
          OUT=source/project/build/libs/xSxLabs-Network-Storage-0.76.0-rc10.1.jar
          [ "$BUILT" = "$OUT" ] || mv "$BUILT" "$OUT"
          unzip -t "$OUT"
          unzip -p "$OUT" META-INF/neoforge.mods.toml | grep -q 'version="0.76.0-rc10.1"'
          javap -classpath "$OUT" -c -p dev.obsidiannetwork.menu.TransferNodeMenu >/tmp/transfer.txt
          grep -q 'quickMoveUpgrade' /tmp/transfer.txt
          sha256sum "$OUT" > "$OUT.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: xsxlabs-network-storage-rc10.1-checkpoint, path: '${{ steps.jar.outputs.path }}', if-no-files-found: error, retention-days: 30}
