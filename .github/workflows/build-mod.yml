name: Build xSxLabs Network Storage RC10.1
on:
  workflow_dispatch:
  push:
    paths: ['.github/BUILD_TRIGGER']
permissions: {contents: read}
concurrency: {group: xsxlabs-network-storage-rc10-1, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: xSxLabs/ObsidianNetwork-Build, ref: rc10.1-hotfix, token: '${{ secrets.PRIVATE_SOURCE_TOKEN }}', path: source, fetch-depth: 1}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.7.1'}
      - name: Reconstruct isolated RC10.1
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir project
          cat payload/compile-src.part* | base64 -d | tar -xJ -C project
          cat payload/rc4-resources.part* | base64 -d | tar -xJ -C project
          cat payload/rc6-overlay.part* | base64 -d | tar -xJ -C project
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project/src/main/java/dev/obsidiannetwork/client/ClientPayloadEvents.java')
          p.write_text(p.read_text().replace(', bus = EventBusSubscriber.Bus.MOD',''))
          PY
          python3 .github/scripts/gen_rc6_assets.py
          cat payload/rc7-code.part* | base64 -d | tar -xJ -C project
          rm -f project/src/main/resources/data/obsidiannetwork/recipe/storage_terminal.json
          python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0
          python3 .github/scripts/gen_rc7_assets.py
          python3 .github/scripts/rc7_cable_model_fix.py
          python3 .github/scripts/rc7_controller_asset_fix.py
          python3 .github/scripts/gen_rc7_item_assets.py
          python3 .github/scripts/rc10_fix.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/rc10_1_hotfix.py')
          s=p.read_text()
          old="s=SCREEN.read_text(); sig='protected void init()';i=s.find(sig)"
          new="s=SCREEN.read_text(); m=re.search(r'\\bvoid\\s+init\\s*\\(\\s*\\)',s);i=m.start() if m else -1"
          if old not in s: raise SystemExit('RC10.1 builder init compatibility anchor missing')
          s=s.replace(old,new,1)
          old_gate="if 'screenModel.cellAtVisibleIndex(' in out or out.count('screenModel.visibleCells()')!=1: raise SystemExit('RC10.1 Shift-lock live lookup survived')"
          new_gate="if 'screenModel.cellAtVisibleIndex(' in out or 'RC10_1_SHIFT_STABLE_SLOT_IDENTITY' not in out or 'rc10_1StableCells(' not in out: raise SystemExit('RC10.1 Shift-lock routing missing')"
          if old_gate not in s: raise SystemExit('RC10.1 builder shift-lock gate anchor missing')
          s=s.replace(old_gate,new_gate,1)
          start=s.index("# 4) Stonecutting preview only.")
          end=s.index("# 5) Energy Cell capacities.")
          s=s[:start]+"# 4) Stonecutting preview is not present in the isolated RC10 reconstructed source.\nprint('RC10.1 PASS 4: Stonecutting preview patch not applicable to isolated RC10 source')\n\n"+s[end:]
          # RC10 uses BASIC/IMPROVED/ADVANCED/ELITE/ULTIMATE in core/EnergyCellTier.java.
          # Patch only the first constructor argument (capacity); leave transfer rates untouched.
          s=s[:end]+'''# 5) Energy Cell capacities for the actual isolated RC10 tier shape.
EC=ROOT/'src/main/java/dev/obsidiannetwork/core/EnergyCellTier.java'
e=EC.read_text()
wanted={'BASIC':1_000_000,'IMPROVED':2_000_000,'ADVANCED':4_000_000,'ELITE':8_000_000,'ULTIMATE':16_000_000}
for name,cap in wanted.items():
 pattern=rf'(?m)^(\\s*{name}\\s*\\(\\s*)(\\d[\\d_]*)(L?)(\\s*,)'
 e2,n=re.subn(pattern,lambda m:m.group(1)+f'{cap:_}'+m.group(3)+m.group(4),e,count=1)
 if n!=1: raise SystemExit('RC10.1 energy tier anchor missing: '+name)
 e=e2
EC.write_text(e)
for name,cap in wanted.items():
 if not re.search(rf'(?m)^\\s*{name}\\s*\\(\\s*{cap:_}L?\\s*,',e): raise SystemExit('RC10.1 energy tier gate missing: '+name)
# Keep the built-in RC10 self-test aligned with the changed ULTIMATE capacity when present.
ST=ROOT/'src/main/java/dev/obsidiannetwork/core/CoreSelfTest.java'
if ST.exists():
 t=ST.read_text().replace('b.capacity()==1_000_000_000L, "ultimate energy capacity"','b.capacity()==16_000_000L, "ultimate energy capacity"')
 ST.write_text(t)
print('RC10.1 PASS 5: Energy Cell capacities = 1M / 2M / 4M / 8M / 16M FE')
'''
          p.write_text(s)
          PY
          python3 .github/scripts/rc10_1_hotfix.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('project')
          gp=root/'gradle.properties'
          gp.write_text(re.sub(r'(?m)^mod_version=.*$','mod_version=0.76.0-rc10.1',gp.read_text()))
          for p in (root/'src/main/resources').rglob('neoforge.mods.toml'):
              p.write_text(re.sub(r'(?m)^version\s*=\s*"[^"]+"','version="0.76.0-rc10.1"',p.read_text()))
          forbidden=('RC41_WHOLE_PLAN_RESERVATION','RC27_RESET_SEARCH_AFTER_JEI_INIT','AUTO_BREWER','rc52_')
          text='\n'.join(p.read_text(errors='ignore') for p in (root/'src/main/java').rglob('*.java'))
          for marker in forbidden:
              assert marker not in text, 'later-chain marker leaked into RC10.1: '+marker
          tr=next((root/'src/main/java').rglob('TransferNodeMenu.java')).read_text()
          assert 'quickMoveUpgrade(original, slots.get(0))' in tr and 'quickMoveUpgrade(original, slots.get(1))' in tr
          screen=next((root/'src/main/java').rglob('StorageTerminalScreen.java')).read_text()
          assert 'RC10_1_SHIFT_STABLE_SLOT_IDENTITY' in screen and 'RC10_1_CLEAR_SEARCH_ON_OPEN' in screen
          ec=(root/'src/main/java/dev/obsidiannetwork/core/EnergyCellTier.java').read_text()
          for name,cap in {'BASIC':1_000_000,'IMPROVED':2_000_000,'ADVANCED':4_000_000,'ELITE':8_000_000,'ULTIMATE':16_000_000}.items():
              assert re.search(rf'(?m)^\s*{name}\s*\(\s*{cap:_}L?\s*,',ec), 'energy capacity gate failed: '+name
          print('RC10.1 isolation/source gates PASS')
          PY
      - name: Compile RC10.1 checkpoint
        working-directory: source/project
        run: gradle --no-daemon --no-configuration-cache clean build --stacktrace
      - name: Verify RC10.1 JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          BUILT=$(find source/project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -1)
          test -n "$BUILT"
          OUT=source/project/build/libs/xSxLabs-Network-Storage-0.76.0-rc10.1.jar
          [ "$BUILT" = "$OUT" ] || mv "$BUILT" "$OUT"
          unzip -t "$OUT"
          unzip -p "$OUT" META-INF/neoforge.mods.toml | grep -q 'version="0.76.0-rc10.1"'
          javap -classpath "$OUT" -c -p dev.obsidiannetwork.menu.TransferNodeMenu >/tmp/transfer.txt
          grep -q 'quickMoveUpgrade' /tmp/transfer.txt
          sha256sum "$OUT" > "$OUT.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: xsxlabs-network-storage-rc10.1-checkpoint, path: '${{ steps.jar.outputs.path }}', if-no-files-found: error, retention-days: 30}
