name: Build xSxLabs Network Storage RC10.1
on:
  workflow_dispatch:
  push:
    paths: ['.github/BUILD_TRIGGER']
permissions: {contents: read}
concurrency: {group: xsxlabs-network-storage-rc10-1, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: xSxLabs/ObsidianNetwork-Build, ref: rc10.1-hotfix, token: '${{ secrets.PRIVATE_SOURCE_TOKEN }}', path: source, fetch-depth: 1}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.7.1'}
      - name: Reconstruct isolated RC10.1
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir project
          cat payload/compile-src.part* | base64 -d | tar -xJ -C project
          cat payload/rc4-resources.part* | base64 -d | tar -xJ -C project
          cat payload/rc6-overlay.part* | base64 -d | tar -xJ -C project
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project/src/main/java/dev/obsidiannetwork/client/ClientPayloadEvents.java')
          p.write_text(p.read_text().replace(', bus = EventBusSubscriber.Bus.MOD',''))
          PY
          python3 .github/scripts/gen_rc6_assets.py
          cat payload/rc7-code.part* | base64 -d | tar -xJ -C project
          rm -f project/src/main/resources/data/obsidiannetwork/recipe/storage_terminal.json
          python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0
          python3 .github/scripts/gen_rc7_assets.py
          # Historical RC7 generator helper targets an older source shape and is not
          # part of the surviving RC10 reconstruction chain.
          python3 .github/scripts/rc7_cable_model_fix.py
          python3 .github/scripts/rc7_controller_asset_fix.py
          python3 .github/scripts/gen_rc7_item_assets.py
          # rc9_fix.py / rc9_polish_fix.py are not present in the RC10 source branch;
          # rc10_fix.py is the surviving historical RC10 reconstruction entry point.
          python3 .github/scripts/rc10_fix.py
          python3 .github/scripts/rc10_1_hotfix.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('project')
          gp=root/'gradle.properties'
          gp.write_text(re.sub(r'(?m)^mod_version=.*$','mod_version=0.76.0-rc10.1',gp.read_text()))
          for p in (root/'src/main/resources').rglob('neoforge.mods.toml'):
              p.write_text(re.sub(r'(?m)^version\s*=\s*"[^"]+"','version="0.76.0-rc10.1"',p.read_text()))
          forbidden=('RC41_WHOLE_PLAN_RESERVATION','RC27_RESET_SEARCH_AFTER_JEI_INIT','AUTO_BREWER','rc52_')
          text='\n'.join(p.read_text(errors='ignore') for p in (root/'src/main/java').rglob('*.java'))
          for marker in forbidden:
              assert marker not in text, 'later-chain marker leaked into RC10.1: '+marker
          tm=next((root/'src/main/java').rglob('TemplateCreatorMenu.java')).read_text()
          assert 'RC10_1_STONECUTTING_PREVIEW_DISABLED' in tm
          tr=next((root/'src/main/java').rglob('TransferNodeMenu.java')).read_text()
          assert 'quickMoveUpgrade(original, slots.get(0))' in tr and 'quickMoveUpgrade(original, slots.get(1))' in tr
          screen=next((root/'src/main/java').rglob('StorageTerminalScreen.java')).read_text()
          assert 'RC10_1_SHIFT_STABLE_SLOT_IDENTITY' in screen and 'RC10_1_CLEAR_SEARCH_ON_OPEN' in screen
          print('RC10.1 isolation/source gates PASS')
          PY
      - name: Compile RC10.1 checkpoint
        working-directory: source/project
        run: gradle --no-daemon --no-configuration-cache clean build --stacktrace
      - name: Verify RC10.1 JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          BUILT=$(find source/project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -1)
          test -n "$BUILT"
          OUT=source/project/build/libs/xSxLabs-Network-Storage-0.76.0-rc10.1.jar
          [ "$BUILT" = "$OUT" ] || mv "$BUILT" "$OUT"
          unzip -t "$OUT"
          unzip -p "$OUT" META-INF/neoforge.mods.toml | grep -q 'version="0.76.0-rc10.1"'
          javap -classpath "$OUT" -c -p dev.obsidiannetwork.menu.TransferNodeMenu >/tmp/transfer.txt
          grep -q 'quickMoveUpgrade' /tmp/transfer.txt
          javap -classpath "$OUT" -c -p dev.obsidiannetwork.menu.TemplateCreatorMenu >/tmp/template.txt
          sha256sum "$OUT" > "$OUT.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: xsxlabs-network-storage-rc10.1-checkpoint, path: '${{ steps.jar.outputs.path }}', if-no-files-found: error, retention-days: 30}
