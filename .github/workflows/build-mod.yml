name: Build xSxLabs Network Storage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout private mod source
        uses: actions/checkout@v6
        with:
          repository: xSxLabs/ObsidianNetwork-Build
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: mod
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check private source
        shell: bash
        run: |
          echo "Private repository was checked out."
          echo "Files in mod directory:"
          ls -la mod

          if [ ! -f "mod/gradlew" ]; then
            echo "ERROR: gradlew was not found in the private repository."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x mod/gradlew

      - name: Build xSxLabs Network Storage
        working-directory: mod
        run: ./gradlew build --stacktrace

      - name: Find built JAR
        id: jar
        shell: bash
        run: |
          JAR=$(find mod/build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*sources*" \
            ! -name "*javadoc*" \
            ! -name "*plain*" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No built mod JAR was found."
            exit 1
          fi

          echo "Found: $JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Create SHA256
        shell: bash
        run: |
          sha256sum "${{ steps.jar.outputs.path }}" \
            > "${{ steps.jar.outputs.path }}.sha256"

      - name: Checkout private build archive
        uses: actions/checkout@v6
        with:
          repository: xSxLabs/ObsidianNetwork-Builds
          token: ${{ secrets.PRIVATE_BUILD_TOKEN }}
          path: builds
          fetch-depth: 1

      - name: Save build privately
        shell: bash
        env:
          JAR: ${{ steps.jar.outputs.path }}
          JAR_NAME: ${{ steps.jar.outputs.name }}
        run: |
          mkdir -p builds/jars

          cp "$JAR" "builds/jars/$JAR_NAME"
          cp "${JAR}.sha256" "builds/jars/${JAR_NAME}.sha256"

          cd builds

          git config user.name "xSxLabs Build Bot"
          git config user.email "actions@github.com"

          git add jars/

          if git diff --cached --quiet; then
            echo "Build already exists - nothing to commit."
            exit 0
          fi

          git commit -m "Build ${{ github.run_number }} - $JAR_NAME"
          git push
