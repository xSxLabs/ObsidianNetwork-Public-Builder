name: Probe RC10.1 Wireless Port
on:
  workflow_dispatch:
  push:
    paths: ['.github/WIRELESS_TRIGGER']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: xSxLabs/ObsidianNetwork-Build, ref: rc10.1-hotfix, token: '${{ secrets.PRIVATE_SOURCE_TOKEN }}', path: source, fetch-depth: 1}
      - name: Reconstruct through RC12 and apply wireless only
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir project
          cat payload/compile-src.part* | base64 -d | tar -xJ -C project
          cat payload/rc4-resources.part* | base64 -d | tar -xJ -C project
          cat payload/rc6-overlay.part* | base64 -d | tar -xJ -C project
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project/src/main/java/dev/obsidiannetwork/client/ClientPayloadEvents.java'); p.write_text(p.read_text().replace(', bus = EventBusSubscriber.Bus.MOD',''))
          PY
          python3 .github/scripts/gen_rc6_assets.py
          cat payload/rc7-code.part* | base64 -d | tar -xJ -C project
          rm -f project/src/main/resources/data/obsidiannetwork/recipe/storage_terminal.json
          python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0
          python3 .github/scripts/gen_rc7_assets.py
          python3 .github/scripts/rc7_cable_model_fix.py
          python3 .github/scripts/rc7_controller_asset_fix.py
          python3 .github/scripts/gen_rc7_item_assets.py
          python3 .github/scripts/rc10_fix.py
          python3 .github/scripts/rc11_fix.py
          python3 .github/scripts/rc12_fix.py
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma,subprocess
          raw=''.join(Path(f'.github/scripts/rc13_wireless.part{i:02d}').read_text() for i in range(2))
          patch=lzma.decompress(base64.b64decode(raw))
          subprocess.run(['patch','-p1','--forward','--batch'],cwd='project',input=patch,check=True)
          for rel in ['src/main/java/dev/obsidiannetwork/menu/StorageTerminalMenu.java','src/main/java/dev/obsidiannetwork/block/StorageTerminalBlock.java','src/main/java/dev/obsidiannetwork/block/WirelessAntennaBlock.java','src/main/java/dev/obsidiannetwork/item/WirelessCraftingTerminalItem.java','src/main/java/dev/obsidiannetwork/network/WorldTopologyBridge.java']:
              p=Path('project')/rel; s=p.read_text(); s=s.replace('import net.minecraft.resources.ResourceLocation;','import net.minecraft.resources.Identifier;').replace('ResourceLocation.parse(','Identifier.parse(').replace('.dimension().location()','.dimension().identifier()').replace('sp.getServer()','sp.level().getServer()').replace('player.getServer()','player.level().getServer()').replace('.displayClientMessage(','.sendSystemMessage(').replace('),true);','));'); p.write_text(s)
          print('WIRELESS_ONLY_APPLIED')
          PY
          grep -R -n -E 'findWirelessAccess|WirelessAccess|runtimeForAccessory|terminalForRuntime|openTerminal\(|stillValid\(' project/src/main/java/dev/obsidiannetwork/{network,item,menu} | head -240
