name: Probe RC10.1 Wireless Port
on:
  workflow_dispatch:
  push:
    paths: ['.github/WIRELESS_TRIGGER']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: xSxLabs/ObsidianNetwork-Build, ref: rc10.1-hotfix, token: '${{ secrets.PRIVATE_SOURCE_TOKEN }}', path: source, fetch-depth: 1}
      - name: Decode RC13 wireless layer
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma,re
          parts=[Path(f'.github/scripts/rc13_wireless.part{i:02d}').read_text() for i in range(2)]
          patch=lzma.decompress(base64.b64decode(''.join(parts))).decode()
          print('=== RC13 WIRELESS PATCH FILES ===')
          files=[]
          for m in re.finditer(r'^\+\+\+ b/(.+)$',patch,re.M):
              if m.group(1) not in files: files.append(m.group(1))
          print('\n'.join(files))
          print('=== RC13 WIRELESS JAVA HUNKS ===')
          keep=False
          for line in patch.splitlines():
              if line.startswith('diff --git '):
                  keep=any(x in line for x in ('Wireless','StorageTerminalMenu','WorldTopologyBridge','ServerTerminalPayloadHandler','ObsidianNetwork.java'))
              if keep: print(line)
          PY
