name: Probe Pure RC10 Wireless Port
on:
  workflow_dispatch:
  push:
    paths: ['.github/WIRELESS_TRIGGER']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: xSxLabs/ObsidianNetwork-Build, ref: rc10.1-hotfix, token: '${{ secrets.PRIVATE_SOURCE_TOKEN }}', path: source, fetch-depth: 1}
      - name: Dump pure RC10 wireless conflicts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir project
          cat payload/compile-src.part* | base64 -d | tar -xJ -C project
          cat payload/rc4-resources.part* | base64 -d | tar -xJ -C project
          cat payload/rc6-overlay.part* | base64 -d | tar -xJ -C project
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project/src/main/java/dev/obsidiannetwork/client/ClientPayloadEvents.java'); p.write_text(p.read_text().replace(', bus = EventBusSubscriber.Bus.MOD',''))
          PY
          python3 .github/scripts/gen_rc6_assets.py
          cat payload/rc7-code.part* | base64 -d | tar -xJ -C project
          rm -f project/src/main/resources/data/obsidiannetwork/recipe/storage_terminal.json
          python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0
          python3 .github/scripts/gen_rc7_assets.py
          python3 .github/scripts/rc7_cable_model_fix.py
          python3 .github/scripts/rc7_controller_asset_fix.py
          python3 .github/scripts/gen_rc7_item_assets.py
          python3 .github/scripts/rc10_fix.py
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma,subprocess
          raw=''.join(Path(f'.github/scripts/rc13_wireless.part{i:02d}').read_text() for i in range(2)); patch=lzma.decompress(base64.b64decode(raw))
          r=subprocess.run(['patch','-p1','--forward','--batch'],cwd='project',input=patch); print('patch_rc',r.returncode)
          rels=['src/main/java/dev/obsidiannetwork/ObsidianNetwork.java','src/main/java/dev/obsidiannetwork/block/ThinNetworkCableBlock.java','src/main/java/dev/obsidiannetwork/menu/StorageTerminalMenu.java','src/main/java/dev/obsidiannetwork/network/WorldTopologyBridge.java','src/main/java/dev/obsidiannetwork/registry/ModBlockEntities.java']
          for rel in rels:
              p=Path('project')/rel; print('\n===== FILE',rel,'=====')
              for i,line in enumerate(p.read_text().splitlines(),1): print(f'{i:04d}: {line}')
              rej=Path(str(p)+'.rej')
              if rej.exists(): print('\n===== REJECT =====\n'+rej.read_text())
          raise SystemExit('intentional pure RC10 context probe')
          PY
