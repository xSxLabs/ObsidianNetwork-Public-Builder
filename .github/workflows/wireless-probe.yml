name: Probe RC10.1 Wireless Port
on:
  workflow_dispatch:
  push:
    paths: ['.github/WIRELESS_TRIGGER']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: xSxLabs/ObsidianNetwork-Build, ref: rc10.1-hotfix, token: '${{ secrets.PRIVATE_SOURCE_TOKEN }}', path: source, fetch-depth: 1}
      - name: Inspect raw RC13 wireless payload
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma
          raw=''.join(Path(f'.github/scripts/rc13_wireless.part{i:02d}').read_text() for i in range(2))
          data=lzma.decompress(base64.b64decode(raw))
          print('bytes=',len(data),'prefix=',repr(data[:120]))
          text=data.decode('utf-8','replace')
          print('=== FIRST 300 LINES ===')
          for i,line in enumerate(text.splitlines()[:300],1): print(f'{i:04d}: {line}')
          print('=== STRUCTURE TOKENS ===')
          for token in ('diff --git','--- ','+++ ','*** Begin Patch','*** Update File','*** Add File','Wireless','wireless','Antenna','antenna'):
              print(token, text.count(token))
          PY
