name: v1.0.4 Wireless Charger Visual Build # build 118
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/v1.0.4-wireless-charger-visual.yml']
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xSxLabs/ObsidianNetwork-Build
          ref: v1.0.4-work
          token: '${{ secrets.PRIVATE_SOURCE_TOKEN }}'
          path: private
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.7.1'}
      - name: Reconstruct stable baseline and apply Fix18 then Fix19
        run: |
          set -euo pipefail
          JAR=private/xSxLabs-Network-Storage-0.76.0-rc10.jar
          test "$(stat -c%s "$JAR")" = 1121869
          test "$(sha256sum "$JAR"|cut -d' ' -f1)" = b98030bce849f5f947eb9c72f94d6ac94880117d672a549040586f03c36f8287
          mkdir -p work/src/main/java work/src/main/resources
          curl -fL --retry 4 -o work/vineflower.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          java -jar work/vineflower.jar "$JAR" work/decompiled
          cp -a work/decompiled/dev work/src/main/java/
          MASTER="$GITHUB_WORKSPACE/$JAR"; (cd work/src/main/resources && jar xf "$MASTER")
          find work/src/main/resources -name '*.class' -delete; rm -f work/src/main/resources/META-INF/MANIFEST.MF
          export V1_SOURCE_ROOT="$GITHUB_WORKSPACE/work/src/main/java" V1_RESOURCE_ROOT="$GITHUB_WORKSPACE/work/src/main/resources"
          python3 private/reconstruction/apply-baseline-fixes.py
          for n in 01-energy-cell-persistence 02-solar-atomic-transfer 03-wireless-open-refund 04-wireless-infinity-chunkload 05-terminal-shift-lock 06-terminal-search-reset 07-transfer-node-upgrade-shiftclick 08-autocraft-reservations 09-template-creator-preview 10-terminal-shift-live-counts 11-wireless-upgrade-transaction 12-autocraft-stable-reservations 13-curios-slot-tag 14-wireless-hotkey-default 15-energy-cell-tooltip 16-wireless-hotkey-curios 17-wireless-hotkey-ae2-style; do python3 "private/fixes/apply-fix-$n.py"; done
          python3 private/fixes/apply-fix-18-facade-render-state.py
          python3 private/fixes/apply-fix-19-facade-lighting.py
          python3 private/fixes/apply-fix-20-facade-vertical-lighting.py
          python3 private/diagnostics/find-storage-cell-capacities.py
          python3 private/fixes/apply-fix-21-energy-cell-capacities.py
          python3 private/diagnostics/find-fix22-terminal-text.py
          python3 private/diagnostics/find-fix23-facade-rotation.py
          python3 private/diagnostics/find-fix24-facade-world-ao-api.py
          python3 private/fixes/apply-fix-25-facade-symmetric-neighbor-light.py
          python3 private/fixes/apply-fix-22-terminal-english-labels.py
          python3 private/v1.0.4/apply-wireless-charger-visual.py
          python3 private/diagnostics/find-v104-terminal-energy-hooks.py
          python3 private/v1.0.4/apply-function-01-terminal-energy-storage.py
          python3 private/v1.0.4/apply-function-02-terminal-active-consumption.py
          python3 private/v1.0.4/apply-function-03-wireless-charger.py
          python3 private/v1.0.4/apply-function-06-direct-block-adjacency.py
          python3 private/v1.0.4/apply-function-07-pickaxe-mining.py
          python3 private/v1.0.4/apply-function-08-filter54-scroll.py
          python3 private/v1.0.4/apply-fix-storage-cell-upgrade-content.py
          grep -Fq 'BASIC(1000000L, 10000L)' work/src/main/java/dev/obsidiannetwork/core/EnergyCellTier.java
          grep -Fq 'IMPROVED(2000000L, 25000L)' work/src/main/java/dev/obsidiannetwork/core/EnergyCellTier.java
          grep -Fq 'ADVANCED(4000000L, 75000L)' work/src/main/java/dev/obsidiannetwork/core/EnergyCellTier.java
          grep -Fq 'ELITE(8000000L, 200000L)' work/src/main/java/dev/obsidiannetwork/core/EnergyCellTier.java
          grep -Fq 'ULTIMATE(16000000L, 500000L)' work/src/main/java/dev/obsidiannetwork/core/EnergyCellTier.java
          grep -Fq '"Cost: "' work/src/main/java/dev/obsidiannetwork/client/DeconstructionTerminalScreen.java
          grep -Fq '"Empty Books: "' work/src/main/java/dev/obsidiannetwork/client/DisenchantingTerminalScreen.java
          ! grep -R -E '"(Kosten|Leere Bücher): ' work/src/main/java/dev/obsidiannetwork/client/{DeconstructionTerminalScreen.java,DisenchantingTerminalScreen.java}
          grep -Fq 'BlockEntityRenderer.super.extractRenderState(blockEntity, state, partialTick, cameraPos, crumblingOverlay);' work/src/main/java/dev/obsidiannetwork/client/render/CableFacadeRenderer.java
          grep -Fq 'state.lightCoords = safeBlockLight << 4 | safeSkyLight << 20;' work/src/main/java/dev/obsidiannetwork/client/render/CableFacadeRenderer.java
          grep -Fq 'for (net.minecraft.core.Direction direction : net.minecraft.core.Direction.values())' work/src/main/java/dev/obsidiannetwork/client/render/CableFacadeRenderer.java
          grep -Fq 'BlockPos lightPos = pos.relative(direction);' work/src/main/java/dev/obsidiannetwork/client/render/CableFacadeRenderer.java
          ! grep -Fq 'Direction.from2DDataValue(state.rotation)' work/src/main/java/dev/obsidiannetwork/client/render/CableFacadeRenderer.java
          echo '=== FACADE LIGHT/AO DIAG ==='; grep -n -C 12 'lightPos\|getBrightness\|blockResolver.update\|facadeModel.submit' work/src/main/java/dev/obsidiannetwork/client/render/CableFacadeRenderer.java
          cat > work/settings.gradle <<'EOF'
          pluginManagement { repositories { gradlePluginPortal() } }
          plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' }
          EOF
          cat > work/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          minecraft_version=26.1.2
          neo_version=26.1.2.106
          mod_id=obsidiannetwork
          mod_version=1.0.4
          mod_group_id=dev.obsidiannetwork
          EOF
          cat > work/build.gradle <<'EOF'
          plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.147' }
          version=mod_version; group=mod_group_id; base { archivesName='xSxLabs-Network-Storage' }
          java.toolchain.languageVersion=JavaLanguageVersion.of(25)
          repositories { maven { url='https://maven.blamejared.com' }; maven { url='https://maven.theillusivec4.top/' } }
          neoForge { version=project.neo_version; mods { obsidiannetwork { sourceSet(sourceSets.main) } } }
          dependencies { compileOnly 'mezz.jei:jei-26.1.2-neoforge:29.5.0.26'; compileOnly 'top.theillusivec4.curios:curios-neoforge:15.0.0+26.1.2:api' }
          tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
          EOF
          (cd work && gradle --no-daemon --no-configuration-cache clean build --stacktrace)
      - name: Fix18 Fix19 bytecode and no-regression gates
        run: |
          set -euo pipefail
          OUT=$(find work/build/libs -type f -name 'xSxLabs-Network-Storage-1.0.4.jar' -print -quit)
          test -n "$OUT"; unzip -t "$OUT" >/dev/null
          javap -classpath "$OUT" -c -p dev.obsidiannetwork.client.render.CableFacadeRenderer > /tmp/facade.bytecode
          grep -Fq 'InterfaceMethod net/minecraft/client/renderer/blockentity/BlockEntityRenderer.extractRenderState' /tmp/facade.bytecode
          grep -Fq 'Level.getBrightness' /tmp/facade.bytecode
          jar tf "$OUT" | sort -u >/tmp/out
          jar tf private/xSxLabs-Network-Storage-0.76.0-rc10.jar | sort -u >/tmp/master
          for p in assets/obsidiannetwork/ data/obsidiannetwork/; do
            awk -v p="$p" 'index($0,p)==1' /tmp/master >/tmp/master.res
            awk -v p="$p" 'index($0,p)==1' /tmp/out >/tmp/out.res
            comm -23 /tmp/master.res /tmp/out.res | grep -v -E '^data/obsidiannetwork/recipe/storage_cell_(2m|4m)\.json$' >/tmp/missing || true
            test ! -s /tmp/missing || { echo "missing resources under $p"; cat /tmp/missing; exit 1; }
          done
          test "$(jar tf "$OUT" | grep -c '^dev/obsidiannetwork/.*\.class$')" -ge 314
          test "$(jar tf "$OUT" | grep -c '^assets/obsidiannetwork/.*\.png$')" -ge 263
          jar tf "$OUT" | grep -Fxq 'data/curios/tags/item/network_terminal.json'
          ! jar tf "$OUT" | grep -Eq '(^|/)(fixes|reconstruction)/|\.py$|vineflower|diagnos'
          for r in 1k 4k 16k 64k 256k 512k 1m; do jar tf "$OUT" | grep -Fxq "data/obsidiannetwork/recipe/storage_cell_${r}.json"; done
          ! jar tf "$OUT" | grep -Eq '^data/obsidiannetwork/recipe/storage_cell_(2m|4m)\.json$'
          jar tf "$OUT" | grep -Fxq 'data/obsidiannetwork/loot_table/blocks/wireless_charger.json'
          sha256sum "$OUT" | tee work/v1.0.4-visual-test.sha256
          cp "$OUT" work/xSxLabs-Network-Storage-v1.0.4-COMBINED-TEST.jar
      - name: Upload v1.0.4 combined test jar
        uses: actions/upload-artifact@v4
        with:
          name: xSxLabs-Network-Storage-v1.0.4-COMBINED-TEST
          path: |
            work/xSxLabs-Network-Storage-v1.0.4-COMBINED-TEST.jar
            work/v1.0.4-visual-test.sha256
          if-no-files-found: error
          retention-days: 30
