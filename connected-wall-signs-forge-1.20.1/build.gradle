plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            arg '-mixin.config=connected_wall_signs.mixins.json'
        }
        client { workingDirectory project.file('run'); mods { connected_wall_signs { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { connected_wall_signs { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
mixin {
    add sourceSets.main, 'connected_wall_signs.refmap.json'
    config 'connected_wall_signs.mixins.json'
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Implementation-Version': project.version,
            'MixinConfigs': 'connected_wall_signs.mixins.json'
        ])
    }
}
